name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Thanks for opening your first issue in PulseKeep! Please make sure to include steps to reproduce and any relevant logs. The maintainers will review it shortly."
        pr-message: "Thank you for your first pull request to PulseKeep! A maintainer will review your changes. Make sure `go build ./...` and `go vet ./...` pass before requesting a review."
