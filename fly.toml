# fly.toml app configuration file generated for pulsekeep-weathered-dust-2479 on 2026-05-23T00:37:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulsekeep-weathered-dust-2479'
primary_region = 'lax'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[deployment]
  strategy = "recreate"
  kill_timeout = "5s"
  kill_signal = "SIGTERM"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
  size = 'shared-cpu-2x'
