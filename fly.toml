# fly.toml app configuration file generated for pulsekeep on 2026-05-22T23:53:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pulsekeep'
primary_region = 'lax'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
  size = 'shared-cpu-2x'
